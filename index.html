ont-size:11px;color:var(--orange)}.timeline-desc{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:3px;white-space:pre-line}.transport{font-size:10.5px;color:#9B7550;margin-top:8px;font-weight:600}.edit-tools{display:flex;gap:5px;margin-top:8px}.edit-tools button{border:1px solid var(--line);background:white;border-radius:9px;padding:5px 8px;font-size:11px}.add-itinerary{width:100%;border:1px dashed #D8C9BE;background:#FFFCF8;border-radius:15px;padding:11px;color:var(--burgundy);font-weight:700;margin:4px 0 22px}.route-card{padding:14px 14px 13px;margin-top:6px}.route-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.route-head b{font-family:'Baloo 2';font-size:15px}.route-head button{border:0;background:none;color:var(--burgundy);font-size:12px;font-weight:700}.route-line{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700}.route-arrow{color:var(--orange)}.route-meta{font-size:11px;color:var(--muted);line-height:1.65;margin-top:7px;white-space:pre-line}.route-link{display:inline-block;margin-top:8px;color:var(--burgundy);font-size:11px;font-weight:700;text-decoration:none}.route-link:after{content:' ↗'}.route-section{margin-top:6px}.route-section-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 9px}.route-section-head b{font-family:'Baloo 2';font-size:15px}.route-add{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;color:var(--burgundy);font-size:11px;font-weight:700}.route-card+.route-card{margin-top:9px}.route-number{font-size:10px;color:var(--muted);font-weight:700;letter-spacing:.8px;margin-bottom:5px}.day-empty{padding:24px 14px;text-align:center;border:1px dashed #D8CFC8;border-radius:18px;color:var(--muted);font-size:12px;margin-bottom:12px}

<body>

    <h1>ISA &amp; Do<br>2027 JAN IN TOKYO 🥳</h1>

function normalizeDB(saved){
  const base=clone(defaults);

function pushCloud(snapshot){
  saveChain=saveChain.then(async()=>{
    const json=JSON.stringify(snapshot);
    if(json===lastCloudJSON)return;
    const {data,error}=await sb.from('trip_state')
      .update({state:snapshot,updated_at:new Date().toISOString()})
      .eq('id',TRIP_ID)
      .select('state,updated_at')
      .single();
    if(error){
      console.error('Supabase save failed:',error);
      showToast('⚠️ 尚未同步，請確認網路');
      return;
    }
    lastCloudJSON=JSON.stringify(data.state||snapshot);
  }).catch(err=>{console.error(err);showToast('⚠️ 尚未同步，請確認網路')});
}

function saveDB(){
  cacheLocal();
  if(!cloudReady)return false;

  const snapshot=clone(db);
  saveTimer=setTimeout(()=>pushCloud(snapshot),180);
  return true;
}

async function loadTripState(){
  const {data,error}=await sb.from('trip_state').select('state,updated_at').eq('id',TRIP_ID).single();

  if(data&&data.state){
    db=normalizeDB(data.state);
    lastCloudJSON=JSON.stringify(data.state);
    cacheLocal();
  }else{
    db=readLocalDraft();
    const {data:seeded,error:seedError}=await sb.from('trip_state')
      .update({state:db,updated_at:new Date().toISOString()})
      .eq('id',TRIP_ID)
      .select('state,updated_at')
      .single();
    if(seedError)throw seedError;
    lastCloudJSON=JSON.stringify(seeded.state||db);
    cacheLocal();
  }
}

      const next=payload.new&&payload.new.state;
      if(!next)return;
      const nextJSON=JSON.stringify(next);
      if(nextJSON===JSON.stringify(db)){lastCloudJSON=nextJSON;return}
      db=normalizeDB(next);
      lastCloudJSON=nextJSON;
      cacheLocal();
      renderCurrentView();
      showToast('☁️ 已同步另一台裝置的更新');

function swipeHTML(i,inner,kind='expense'){return `<div class="swipe-shell" data-i="${i}" data-kind="${kind}"><button class="delete-action" type="button">🗑</button><div class="expense-row">${inner}</div></div>`}
function setupSwipe(shell,row,onDelete,onClick){
  const reveal=72;
  let startX=0,dx=0,base=0,moved=false,dragging=false,open=false;
  const setX=x=>{dx=Math.max(0,Math.min(reveal,x));row.style.transform=`translateX(${dx}px)`};
  const finish=()=>{
    if(!dragging)return;
    dragging=false;
    open=dx>reveal/2;
    setX(open?reveal:0);
  };
  row.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse' && e.button!==0)return;
    if(e.target.closest('input,select,textarea,button,a'))return;
    if(e.pointerType==='mouse')e.preventDefault();
    startX=e.clientX;base=open?reveal:0;dx=base;moved=false;dragging=true;
    try{row.setPointerCapture?.(e.pointerId)}catch(_){}
  });
  row.addEventListener('pointermove',e=>{
    if(!dragging)return;
    const delta=e.clientX-startX;
    if(Math.abs(delta)>5)moved=true;
    setX(base+delta);
  });
  row.addEventListener('pointerup',finish);
  row.addEventListener('pointercancel',finish);

  // Delete button is deliberately outside the draggable row.
  // Stop pointer/click propagation so desktop and iPhone taps both fire reliably.
  const del=shell.querySelector('.delete-action');
  del.addEventListener('pointerdown',e=>e.stopPropagation());
  del.addEventListener('click',e=>{
    e.preventDefault();
    e.stopPropagation();
    if(typeof onDelete==='function') onDelete();
  });

  row.addEventListener('click',e=>{
    if(e.target.closest('input,select,textarea,button,a'))return;
    if(moved){moved=false;return;}
    if(open){open=false;setX(0);return;}
    onClick&&onClick();
  });
}

  deleteConfirm.setAttribute('aria-hidden','true');
}
document.getElementById('deleteCancel').addEventListener('click',closeDeleteConfirm);
document.getElementById('deleteOK').addEventListener('click',()=>{
  const action=pendingDelete;
  closeDeleteConfirm();
  if(action) action();
});
deleteConfirm.addEventListener('click',e=>{if(e.target===deleteConfirm)closeDeleteConfirm()});

function renderExpenseList(){const list=document.getElementById('expenseList'),rows=db[active]||[];if(!rows.length){list.innerHTML='<div class="empty">目前還沒有紀錄 ♡</div>';return}list.innerHTML=rows.map((x,i)=>swipeHTML(i,`<div class="expense-top"><div><div class="expense-name">${esc(x.name)}</div><div class="expense-meta">${x.date?esc(x.date)+' · ':''}${esc(x.payer)}</div></div><div class="expense-amount">${esc(x.currency)} ${esc(x.amount)}</div></div>`)).join('');list.querySelectorAll('.swipe-shell').forEach(shell=>{const i=+shell.dataset.i;setupSwipe(shell,shell.querySelector('.expense-row'),()=>requestDelete(`確定刪除「${db[active][i].name}」？`,()=>{db[active].splice(i,1);saveDB();renderPaid()}),()=>editExpense(i))})}
function editExpense(i){const x=db[active][i],name=prompt('修改名稱',x.name);if(name===null)return;const amount=prompt('修改金額',x.amount);if(amount===null)return;x.name=name;x.amount=amount;saveDB();renderPaid()}
function controlRow(obj,path){return `<div class="fixed-grid"><input data-path="${path}.amount" inputmode="decimal" value="${esc(obj.amount)}" placeholder="金額"><select data-path="${path}.currency">${opts(currencies,obj.currency)}</select><select data-path="${path}.payer">${opts(payers,obj.payer||'無')}</select></div>`}
function renderOther(){panel.innerHTML=`<div class="fixed-list"><div class="fixed-item"><div class="fixed-title">✈️ 機票</div>${controlRow(db.other.flight,'other.flight')}</div><div class="fixed-item"><div class="fixed-title">🚕 計程車</div><div id="taxiList" class="transport-add"></div><div class="other-actions"><button type="button" id="addTaxi">＋ 新增計程車</button></div></div><div class="fixed-item"><div class="fixed-title">🚃 地鐵 / JR</div><div id="metroList" class="transport-add"></div><div class="other-actions"><button type="button" id="addMetro">＋ 新增交通</button></div></div><div class="fixed-item"><div class="fixed-title">🏨 飯店</div>${db.other.hotels.map((h,i)=>`<div class="fixed-label">${esc(h.label)}</div>${controlRow(h,`other.hotels.${i}`)}`).join('')}</div><div class="fixed-item"><div class="fixed-title">🛡️ 旅平險</div>${db.other.insurance.map((x,i)=>`<div class="fixed-label">${esc(x.label)}</div>${controlRow(x,`other.insurance.${i}`)}`).join('')}</div></div><div class="hint"> 修改後會自動同步 ☺︎ </div>`;renderTransport('taxis','taxiList','計程車');renderTransport('metros','metroList','交通');document.getElementById('addTaxi').onclick=()=>{db.other.taxis.push({date:'1/16',name:'',amount:'',currency:'JPY',payer:'無'});saveDB();renderOther()};document.getElementById('addMetro').onclick=()=>{db.other.metros.push({date:'1/16',name:'',amount:'',currency:'JPY',payer:'無'});saveDB();renderOther()};bindOtherControls()}
function renderTransport(key,id,label){const box=document.getElementById(id),arr=db.other[key];if(!arr.length){box.innerHTML='<div class="empty">目前沒有紀錄</div>';return}box.innerHTML=arr.map((x,i)=>swipeHTML(i,`<div class="field-row"><div class="field"><label>日期</label><select data-tkey="${key}" data-i="${i}" data-f="date">${opts(dates,x.date)}</select></div><div class="field"><label>名稱</label><input data-tkey="${key}" data-i="${i}" data-f="name" value="${esc(x.name)}" placeholder="${label}名稱"></div></div><div class="fixed-grid" style="margin-top:7px"><input data-tkey="${key}" data-i="${i}" data-f="amount" inputmode="decimal" value="${esc(x.amount)}" placeholder="金額"><select data-tkey="${key}" data-i="${i}" data-f="currency">${opts(currencies,x.currency)}</select><select data-tkey="${key}" data-i="${i}" data-f="payer">${opts(payers,x.payer||'無')}</select></div>`,key)).join('');box.querySelectorAll('[data-tkey]').forEach(el=>el.onchange=el.oninput=()=>{db.other[el.dataset.tkey][+el.dataset.i][el.dataset.f]=el.value;saveDB()});box.querySelectorAll('.swipe-shell').forEach(shell=>{const i=+shell.dataset.i;setupSwipe(shell,shell.querySelector('.expense-row'),()=>requestDelete(`確定刪除這筆${label}？`,()=>{db.other[key].splice(i,1);saveDB();renderOther()}),null)})}
function setPath(path,value){const parts=path.split('.');let o=db;for(let i=0;i<parts.length-1;i++)o=o[parts[i]];o[parts.at(-1)]=value;saveDB()}
function bindOtherControls(){document.querySelectorAll('[data-path]').forEach(el=>el.onchange=el.oninput=()=>setPath(el.dataset.path,el.value))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=active===b.dataset.tab?null:b.dataset.tab;renderPaid()});

/* Important */
const impList=document.getElementById('importantList');
function renderImportant(){impList.innerHTML=db.important.map((x,i)=>`<div class="swipe-shell" data-i="${i}"><button class="delete-action" type="button">🗑</button><div class="important-row ${x.done?'done':''}"><button type="button" class="circle ${x.done?'done':''}" aria-label="完成"></button><span class="important-text">${esc(x.text)}</span></div></div>`).join('')||'<div class="empty">目前沒有事項</div>';impList.querySelectorAll('.swipe-shell').forEach(shell=>{const i=+shell.dataset.i,row=shell.querySelector('.important-row');setupSwipe(shell,row,()=>requestDelete(`確定刪除「${db.important[i].text}」？`,()=>{db.important.splice(i,1);saveDB();renderImportant()}),null);row.querySelector('.circle').onclick=e=>{e.stopPropagation();db.important[i].done=!db.important[i].done;saveDB();renderImportant()};row.querySelector('.important-text').onclick=e=>{e.stopPropagation();const v=prompt('修改事項',db.important[i].text);if(v!==null&&v.trim()){db.important[i].text=v.trim();saveDB();renderImportant()}}})}
const importantForm=document.getElementById('importantForm');
const importantInput=document.getElementById('importantInput');
const importantAddBtn=document.getElementById('importantAddBtn');
function addImportant(){
  const text=importantInput.value.trim();
  if(!text)return;
  db.important.push({text,done:false});
  importantInput.value='';
  saveDB();
  renderImportant();
  importantInput.focus();
}
window.addImportant=addImportant;
importantAddBtn.onclick=addImportant;
importantInput.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();addImportant();}});

/* Schedule editor */
const itemSheet=document.getElementById('itemSheet'),metaSheet=document.getElementById('metaSheet'),routeSheet=document.getElementById('routeSheet');
function openSheet(el){el.classList.add('open');document.body.style.overflow='hidden'}function closeSheet(el){el.classList.remove('open');document.body.style.overflow=''}
document.querySelectorAll('[data-close-sheet]').forEach(b=>b.onclick=()=>closeSheet(b.closest('.sheet-backdrop')));document.querySelectorAll('.sheet-backdrop').forEach(bg=>bg.addEventListener('click',e=>{if(e.target===bg)closeSheet(bg)}));
function renderDay(){const info=dayInfo[currentDay],day=db.schedule[currentDay];document.getElementById('dayKicker').textContent=`${info.date} · ${info.weekday}`;document.getElementById('dayTitle').textContent=day.title||info.title;document.getElementById('daySubtitle').textContent=day.subtitle||info.subtitle;document.getElementById('editDayMeta').hidden=!editMode;document.getElementById('addItinerary').hidden=!editMode;document.getElementById('editToggle').textContent=editMode?'完成 ✓':'✎ 編輯';renderTimeline();renderRoute()}
function renderTimeline(){const box=document.getElementById('timeline'),items=db.schedule[currentDay].items||[];if(!items.length){box.innerHTML=`<div class="day-empty">這一天還沒有行程${editMode?'，按下面「＋ 新增行程」開始加入。':'。'}</div>`;return}box.innerHTML=`<div class="timeline">${items.map((x,i)=>{const url=safeUrl(x.url);return `<div class="timeline-item"><div class="timeline-time">${esc(x.time||'--:--')}</div><div class="timeline-axis"><span class="timeline-dot"></span></div><div class="timeline-body"><div class="timeline-title">${url?`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(x.title)}</a>`:esc(x.title)}</div>${x.description?`<div class="timeline-desc">${esc(x.description)}</div>`:''}${x.transport||x.transportMinutes?`<div class="transport">${esc(x.transport||'')} ${x.transportMinutes?`· ${esc(x.transportMinutes)} min`:''}</div>`:''}${editMode?`<div class="edit-tools"><button data-edit-item="${i}">✎ 修改</button><button data-up="${i}" ${i===0?'disabled':''}>↑</button><button data-down="${i}" ${i===items.length-1?'disabled':''}>↓</button></div>`:''}</div></div>`}).join('')}</div>`;box.querySelectorAll('[data-edit-item]').forEach(b=>b.onclick=()=>openItem(+b.dataset.editItem));box.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveItem(+b.dataset.up,-1));box.querySelectorAll('[data-down]').forEach(b=>b.onclick=()=>moveItem(+b.dataset.down,1))}
function moveItem(i,delta){const arr=db.schedule[currentDay].items,j=i+delta;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];saveDB();renderTimeline()}
function openItem(index=null){const form=document.getElementById('itemForm'),editing=index!==null,x=editing?db.schedule[currentDay].items[index]:{time:'',title:'',description:'',url:'',transport:'',transportMinutes:''};form.elements.index.value=editing?index:'';for(const k of ['time','title','description','url','transport','transportMinutes'])form.elements[k].value=x[k]||'';document.getElementById('itemSheetTitle').textContent=editing?'編輯行程':'新增行程';document.getElementById('deleteItem').hidden=!editing;openSheet(itemSheet)}
document.getElementById('addItinerary').onclick=()=>openItem();
document.getElementById('itemForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),obj={time:f.get('time'),title:f.get('title').trim(),description:f.get('description').trim(),url:f.get('url').trim(),transport:f.get('transport').trim(),transportMinutes:f.get('transportMinutes').trim()},idx=f.get('index');if(idx==='')db.schedule[currentDay].items.push(obj);else db.schedule[currentDay].items[+idx]=obj;saveDB();closeSheet(itemSheet);renderDay()};
document.getElementById('deleteItem').onclick=()=>{const idx=document.getElementById('itemForm').elements.index.value;if(idx!=='')requestDelete('確定刪除這個行程？',()=>{db.schedule[currentDay].items.splice(+idx,1);saveDB();closeSheet(itemSheet);renderDay()})};
document.getElementById('editToggle').onclick=()=>{editMode=!editMode;renderDay()};
document.getElementById('editDayMeta').onclick=()=>{const day=db.schedule[currentDay],f=document.getElementById('metaForm');f.elements.title.value=day.title||'';f.elements.subtitle.value=day.subtitle||'';openSheet(metaSheet)};
document.getElementById('metaForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);db.schedule[currentDay].title=f.get('title').trim();db.schedule[currentDay].subtitle=f.get('subtitle').trim();saveDB();closeSheet(metaSheet);renderDay();renderDateLinks()};
function renderRoute(){
  const routes=Array.isArray(db.schedule[currentDay].routes)?db.schedule[currentDay].routes:[];
  const cards=routes.length?routes.map((r,i)=>{
    const has=Object.values(r||{}).some(Boolean);
    // 相容舊資料：舊版只有 from / to 時，自動合成 NOTE 標題，不會讓原本資料消失。
    const noteTitle=(r.title||[r.from,r.to].filter(Boolean).join(' → ')||'未命名 NOTE').trim();
    // 路線、時間/價格、備註各自獨立顯示；即使「路線」留白，備註仍會出現在 NOTE 卡片。
    const metaLines=[];
    if(r.line)metaLines.push(r.line);
    if(r.duration||r.fare)metaLines.push([r.duration,r.fare].filter(Boolean).join(' · '));
    if(r.note)metaLines.push(r.note);
    return `<div class="route-card card">
      <div class="route-head"><div><div class="route-number">NOTE ${String(i+1).padStart(2,'0')}</div><b>${esc(noteTitle)}</b></div>${editMode?`<button data-edit-route="${i}">✎ 編輯</button>`:''}</div>
      ${has?`${metaLines.length?`<div class="route-meta">${esc(metaLines.join('\n'))}</div>`:''}${safeUrl(r.url)?`<a class="route-link" href="${esc(safeUrl(r.url))}" target="_blank" rel="noopener">開啟路線</a>`:''}`:'<div class="empty">尚未加入 NOTE</div>'}
    </div>`;
  }).join(''):`<div class="route-card card"><div class="empty">尚未加入 NOTE</div></div>`;
  document.getElementById('routeArea').innerHTML=`<div class="route-section"><div class="route-section-head"><b>NOTE</b>${editMode?'<button class="route-add" id="addRoute">＋ 新增 NOTE</button>':''}</div>${cards}</div>`;
  document.querySelectorAll('[data-edit-route]').forEach(b=>b.onclick=()=>openRoute(+b.dataset.editRoute));
  const add=document.getElementById('addRoute');if(add)add.onclick=()=>openRoute();
}
function openRoute(index=null){
  const routes=Array.isArray(db.schedule[currentDay].routes)?db.schedule[currentDay].routes:[];
  const editing=index!==null;
  const r=editing?(routes[index]||{}):{};
  const f=document.getElementById('routeForm');
  f.elements.index.value=editing?index:'';
  f.elements.title.value=r.title||[r.from,r.to].filter(Boolean).join(' → ')||'';
  for(const k of ['line','duration','fare','note','url'])f.elements[k].value=r[k]||'';
  document.getElementById('routeSheetTitle').textContent=editing?'編輯 NOTE':'新增 NOTE';
  document.getElementById('deleteRoute').hidden=!editing;
  openSheet(routeSheet);
}
document.getElementById('routeForm').onsubmit=e=>{
  e.preventDefault();
  const f=new FormData(e.target),r={};
  for(const k of ['title','line','duration','fare','note','url'])r[k]=(f.get(k)||'').trim();
  const idx=f.get('index');
  if(!Array.isArray(db.schedule[currentDay].routes))db.schedule[currentDay].routes=[];
  if(idx==='')db.schedule[currentDay].routes.push(r);else db.schedule[currentDay].routes[+idx]=r;
  saveDB();closeSheet(routeSheet);renderRoute();
};
document.getElementById('deleteRoute').onclick=()=>{
  const idx=document.getElementById('routeForm').elements.index.value;
  if(idx==='')return;
  requestDelete('確定刪除這個 NOTE？',()=>{
    db.schedule[currentDay].routes.splice(+idx,1);
    saveDB();closeSheet(routeSheet);renderRoute();
  });
};

/* FX: prototype rate only; final deployment should use live API */
let rate=.215,lock=false;const j=document.getElementById('jpy'),t=document.getElementById('twd');function num(v){return parseFloat(String(v).replace(/,/g,''))||0}function fmt(v){return v?new Intl.NumberFormat('zh-TW',{maximumFractionDigits:2}).format(v):''}j.oninput=()=>{if(lock)return;lock=true;t.value=fmt(num(j.value)*rate);lock=false};t.oninput=()=>{if(lock)return;lock=true;j.value=fmt(num(t.value)/rate);lock=false};document.getElementById('swap').onclick=()=>{const a=j.value;j.value=t.value;t.value=a};

initAuth();
</script>
